name: Build and Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: imagesorter
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    # Run PyQt tests headlessly in Linux
    - name: Run Tests
      working-directory: imagesorter
      run: |
        pytest --cov=src
      env:
        QT_QPA_PLATFORM: offscreen

  build-and-release:
    name: Build PyInstaller Executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      working-directory: imagesorter
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Executable (Standalone)
      working-directory: imagesorter
      run: |
        python build.py --standalone

    - name: Generate Checksum
      working-directory: imagesorter/dist
      run: |
        $hash = Get-FileHash ImageSorter.exe -Algorithm SHA256
        $hash.Hash + "  ImageSorter.exe" > ImageSorter.exe.sha256
      shell: powershell

    - name: Zip Artifacts
      working-directory: imagesorter/dist
      run: |
        Compress-Archive -Path ImageSorter.exe, ImageSorter.exe.sha256 -DestinationPath ImageSorter-Release.zip
      shell: powershell

    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v1
      with:
        files: imagesorter/dist/ImageSorter-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}