name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ONNXRUNTIME_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / Ubuntu 24.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libdbus-1-3
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Lint
        run: ruff check src tests scripts build_desktop.py
      - name: Offline tests
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: python -m pytest -m "not packaging" --cov=imagesorter --cov-report=term-missing tests

  x11-smoke:
    name: Ubuntu 24.04 X11 smoke
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libdbus-1-3 xvfb
          python -m pip install -e ".[dev]"
      - name: Run isolated X11 tests
        env:
          QT_QPA_PLATFORM: xcb
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: xvfb-run --auto-servernum python -m pytest tests/test_platform_startup.py tests/test_p07_infrastructure.py

  native-portability:
    name: Experimental native smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Portable core smoke with isolated state
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          XDG_STATE_HOME: ${{ runner.temp }}/state
          APPDATA: ${{ runner.temp }}/appdata
          LOCALAPPDATA: ${{ runner.temp }}/localappdata
        run: |
          python -m pytest tests/test_core.py tests/test_settings_hardening.py tests/test_accessibility.py tests/test_concurrency.py

  linux-artifacts:
    name: Wheel, onedir, and AppImage
    runs-on: ubuntu-24.04
    needs: [quality, x11-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libdbus-1-3 xvfb file
          python -m pip install --upgrade build
          python -m pip install -e ".[dev]"
      - name: Build wheel and verify clean installation
        run: |
          python -m build --wheel
          python -m venv "${{ runner.temp }}/wheel-venv"
          "${{ runner.temp }}/wheel-venv/bin/pip" install dist/imagesorter-*.whl
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/wheel-venv/bin/imagesorter" --help
          "${{ runner.temp }}/wheel-venv/bin/python" -c "from imagesorter.paths import get_resource_dir; assert (get_resource_dir() / 'imagesorter.png').is_file()"
      - name: Build onedir and required AppImage
        run: python build_desktop.py --appimage
      - name: Smoke actual frozen GUI and AppImage extraction
        env:
          QT_QPA_PLATFORM: offscreen
          XDG_CONFIG_HOME: ${{ runner.temp }}/smoke-config
          XDG_DATA_HOME: ${{ runner.temp }}/smoke-data
          XDG_CACHE_HOME: ${{ runner.temp }}/smoke-cache
          XDG_STATE_HOME: ${{ runner.temp }}/smoke-state
        run: |
          python -c "from PIL import Image; Image.new('RGB', (32, 32), 'blue').save('${{ runner.temp }}/smoke.png')"
          set +e
          timeout 5s ./dist/ImageSorter/ImageSorter "${{ runner.temp }}/smoke.png"
          status=$?
          set -e
          test "$status" -eq 124
          ./dist/ImageSorter-x86_64.AppImage --appimage-extract
          test -x squashfs-root/AppRun
          set +e
          timeout 5s squashfs-root/AppRun "${{ runner.temp }}/smoke.png"
          status=$?
          set -e
          test "$status" -eq 124
      - name: Archive and attest artifacts
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf dist/ImageSorter-linux-x86_64.tar.gz -C dist ImageSorter
          python scripts/create_release_manifest.py --dist dist --source-sha "${{ github.sha }}"
          (cd dist && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: imagesorter-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.AppImage
            dist/*.tar.gz
            dist/checksums.txt
            dist/release_manifest.json

  optional-ai-integration:
    name: Optional pinned AI download and CPU inference
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    needs: quality
    env:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Download, verify, and infer with CPU provider
        run: python scripts/verify_optional_ai.py --model-dir "${{ runner.temp }}/models" --fixture "${{ runner.temp }}/fixture.jpg"
