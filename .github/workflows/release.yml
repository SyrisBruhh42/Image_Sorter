name: Release Qualification & Artifact Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Instructions'
        required: false
        default: 'Manual Release Dispatch'

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libdbus-1-3

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and dev dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          pip install -e ".[dev]"

      - name: Run diagnostic script pre-flight
        run: |
          python3 scripts/diagnose_linux_p07.py --json > release_diagnostics.json

      - name: Build Wheel Package
        run: |
          pip wheel --no-deps --wheel-dir dist .

      - name: Build PyInstaller Standalone Binary
        run: |
          python3 build.py

      - name: Check P06 AppImage Build Contract
        run: |
          if [ -f "dist/build_appimage.sh" ]; then
            echo "build_appimage.sh script found in dist."
          fi
          echo "Note: Full 'python build.py --appimage' execution requires integrated P06 contract."

      - name: Generate Release Manifest & SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt 2>/dev/null || true
          python3 -c "
          import json, os, sys, glob, hashlib
          import imagesorter

          files = glob.glob('*')
          hashes = {}
          for fn in files:
              if os.path.isfile(fn):
                  with open(fn, 'rb') as f:
                      hashes[fn] = hashlib.sha256(f.read()).hexdigest()

          manifest = {
              'version': getattr(imagesorter, '__version__', '1.0.0'),
              'source_sha': '${{ github.sha }}',
              'ref': '${{ github.ref }}',
              'build_environment': 'ubuntu-24.04',
              'python_version': sys.version.split()[0],
              'artifacts_sha256': hashes,
              'platform_support': {
                  'linux_x86_64': 'supported',
                  'windows_x86_64': 'experimental',
                  'macos_x64_arm64': 'experimental'
              }
          }
          with open('release_manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          ls -la

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imagesorter-release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/ImageSorter/
            dist/checksums.txt
            dist/release_manifest.json
            release_diagnostics.json
