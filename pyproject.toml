[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagesorter"
version = "1.0.0"
description = "High-Throughput Image Triage & AI Tagging Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SyrisBruhh42" }
]
keywords = ["image", "triage", "sorter", "exif", "ai", "tagger", "onnx", "pyqt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "PyQt6>=6.4.0",
    "Pillow>=9.0.0",
    "piexif>=1.1.3",
    "onnxruntime>=1.14.0",
    "numpy>=1.21.0",
    "psutil>=5.9.0",
    "Send2Trash>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.13.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/SyrisBruhh42/Image_Sorter"
Repository = "https://github.com/SyrisBruhh42/Image_Sorter"
Issues = "https://github.com/SyrisBruhh42/Image_Sorter/issues"

[project.scripts]
imagesorter = "imagesorter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagesorter = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
